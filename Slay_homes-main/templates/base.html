<!DOCTYPE html>
<html class="light" lang="en">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>SLAYHOMES</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
    <script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "background": "#0b0b0f",
                        "on-background": "#f8f9ff",
                        "surface": "#12121a",
                        "on-surface": "#f8f9ff",
                        "surface-variant": "#1a1a26",
                        "on-surface-variant": "#a1a7b3",
                        "surface-container-lowest": "#050508",
                        "surface-container-low": "#0b0b0f",
                        "surface-container": "#12121a",
                        "surface-container-high": "#1a1a26",
                        "surface-container-highest": "#232333",
                        "outline": "#717783",
                        "outline-variant": "#333344",
                        "primary": "#3b82f6",
                        "on-primary": "#ffffff",
                        "primary-container": "#1e3a8a",
                        "on-primary-container": "#dbeafe",
                        "secondary": "#10b981",
                        "on-secondary": "#ffffff",
                        "secondary-container": "#064e3b",
                        "on-secondary-container": "#d1fae5",
                        "error": "#ef4444",
                        "on-error": "#ffffff",
                        "error-container": "#7f1d1d",
                        "on-error-container": "#fee2e2"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "xs": "4px",
                        "margin": "32px",
                        "sm": "12px",
                        "gutter": "24px",
                        "lg": "40px",
                        "base": "8px",
                        "md": "24px",
                        "xl": "64px"
                    },
                    "fontFamily": {
                        "h2": ["Inter"],
                        "body-md": ["Inter"],
                        "label-sm": ["Inter"],
                        "body-lg": ["Inter"],
                        "h3": ["Inter"],
                        "h1": ["Inter"],
                        "label-md": ["Inter"]
                    },
                    "fontSize": {
                        "h2": ["32px", {"lineHeight": "1.3", "letterSpacing": "-0.01em", "fontWeight": "700"}],
                        "body-md": ["16px", {"lineHeight": "1.6", "letterSpacing": "0", "fontWeight": "400"}],
                        "label-sm": ["12px", {"lineHeight": "1.2", "letterSpacing": "0.04em", "fontWeight": "500"}],
                        "body-lg": ["18px", {"lineHeight": "1.6", "letterSpacing": "0", "fontWeight": "400"}],
                        "h3": ["24px", {"lineHeight": "1.4", "letterSpacing": "0", "fontWeight": "600"}],
                        "h1": ["40px", {"lineHeight": "1.2", "letterSpacing": "-0.02em", "fontWeight": "700"}],
                        "label-md": ["14px", {"lineHeight": "1.2", "letterSpacing": "0.02em", "fontWeight": "600"}]
                    }
                },
            },
        }
    </script>
    <style>
        .ambient-shadow {
            box-shadow: 0px 4px 20px rgba(74, 144, 226, 0.08);
        }
        .soft-gradient {
            background: radial-gradient(circle at top left, #0b0b0f 0%, #1a1a26 100%);
        }
        .glass-input:focus {
            box-shadow: 0 0 0 2px rgba(0, 93, 167, 0.1);
        }

        /* Sidebar Responsiveness & Animations */
        :root {
            --sidebar-width: 256px;
            --sidebar-collapsed-width: 80px;
            --transition-speed: 300ms;
        }

        .sidebar-container {
            width: var(--sidebar-width);
            transition: all var(--transition-speed) cubic-bezier(0.4, 0, 0.2, 1);
            overflow-x: hidden;
            white-space: nowrap;
        }

        .main-content {
            margin-left: var(--sidebar-width);
            transition: all var(--transition-speed) cubic-bezier(0.4, 0, 0.2, 1);
        }

        /* Desktop Collapsed State */
        body.sidebar-collapsed .sidebar-container {
            width: var(--sidebar-collapsed-width);
        }

        body.sidebar-collapsed .main-content {
            margin-left: var(--sidebar-collapsed-width);
        }

        body.sidebar-collapsed .sidebar-text,
        body.sidebar-collapsed .sidebar-header-desc,
        body.sidebar-collapsed .sidebar-header-title,
        body.sidebar-collapsed nav span:not(.material-symbols-outlined) {
            opacity: 0;
            pointer-events: none;
            width: 0;
            display: none !important;
        }

        body.sidebar-collapsed .sidebar-header-title {
            display: none !important;
        }
        
        body.sidebar-collapsed .sidebar-container a {
            justify-content: center;
            padding-left: 0;
            padding-right: 0;
        }

        body.sidebar-collapsed .sidebar-container > div:first-child {
            justify-content: center !important;
            padding-left: 0 !important;
            padding-right: 0 !important;
        }

        /* Mobile Drawer State */
        @media (max-width: 767px) {
            .sidebar-container {
                width: var(--sidebar-width);
                position: fixed;
                z-index: 999 !important;
                height: 100vh;
                left: 0;
                transform: translateX(0);
                background-color: #12121a !important; /* Ensure dark background */
                border-right: 1px solid #333344 !important;
                transition: transform var(--transition-speed) cubic-bezier(0.4, 0, 0.2, 1);
            }
            .main-content {
                margin-left: 0 !important; /* Don't push content on mobile */
                width: 100%;
            }
            
            body.sidebar-collapsed .sidebar-container {
                transform: translateX(-100%);
            }
            
            /* Hamburger button when sidebar is collapsed */
            .mobile-menu-btn {
                display: none;
            }
            body.sidebar-collapsed .mobile-menu-btn {
                display: flex;
                position: fixed;
                top: 1rem;
                left: 1rem;
                z-index: 90;
                background: #1a1a26;
                padding: 0.5rem;
                border-radius: 0.5rem;
                box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.5);
                border: 1px solid #333344;
                z-index: 998;
            }
            
            .sidebar-overlay {
                display: block;
                position: fixed;
                top: 0;
                left: 0;
                width: 100vw;
                height: 100vh;
                background: rgba(0,0,0,0.5);
                backdrop-filter: blur(4px);
                z-index: 990;
                opacity: 1;
                transition: opacity 0.3s;
            }
            
            body.sidebar-collapsed .sidebar-overlay {
                opacity: 0;
                pointer-events: none;
            }

            /* Skeleton Animation */
            @keyframes skeleton-pulse {
                0% { background-color: #1a1a26; }
                50% { background-color: #232333; }
                100% { background-color: #1a1a26; }
            }
            .skeleton {
                animation: skeleton-pulse 1.5s infinite ease-in-out;
                border-radius: 0.5rem;
            }
        }
        @media (min-width: 768px) {
            .mobile-menu-btn {
                display: none !important;
            }
            .sidebar-overlay {
                display: none !important;
            }
        }

        /* Hide horizontal scroll on mobile */
        body {
            overflow-x: hidden;
            width: 100%;
        }
        /* Skull Animation */
        @keyframes skull-pulse {
            0% { transform: scale(1); filter: drop-shadow(0 0 10px rgba(59, 130, 246, 0.5)); }
            50% { transform: scale(1.1); filter: drop-shadow(0 0 30px rgba(59, 130, 246, 0.8)); }
            100% { transform: scale(1); filter: drop-shadow(0 0 10px rgba(59, 130, 246, 0.5)); }
        }
        .skull-animation {
            animation: skull-pulse 2s infinite ease-in-out;
        }
        #login-splash {
            background: radial-gradient(circle at center, #1a1a26 0%, #0b0b0f 100%);
            z-index: 1000;
        }
    </style>
    <script>
        // Sidebar State Management
        function initSidebar() {
            const isCollapsed = localStorage.getItem('sidebarCollapsed') === 'true';
            // Apply collapsed state on all devices if saved
            if (isCollapsed) {
                document.body.classList.add('sidebar-collapsed');
            }
            
            // Add click listeners to all nav links to auto-close or collapse
            document.querySelectorAll('.sidebar-container a').forEach(link => {
                link.addEventListener('click', (e) => {
                    // For small screens, we auto-collapse after selection
                    if (window.innerWidth < 768) {
                        document.body.classList.add('sidebar-collapsed');
                        localStorage.setItem('sidebarCollapsed', 'true');
                    }
                });
            });
        }

        function toggleSidebar() {
            const isCollapsed = document.body.classList.toggle('sidebar-collapsed');
            localStorage.setItem('sidebarCollapsed', isCollapsed);
            
            // On mobile, if we are opening (un-collapsing), we might want to ensure it's visible
            // But the current logic handles it via classes
        }

        document.addEventListener('DOMContentLoaded', () => {
            initSidebar();
            
            // Hide mobile menu button if no sidebar exists
            const sidebar = document.querySelector('.sidebar-container');
            const menuBtn = document.querySelector('.mobile-menu-btn');
            if (!sidebar && menuBtn) {
                menuBtn.style.display = 'none';
            }
        });
    </script>
</head>
<body class="bg-[#0b0b0f] font-body-md text-white min-h-screen relative">
    <button onclick="toggleSidebar()" aria-label="Open Menu" class="mobile-menu-btn text-white transition-opacity duration-300">
        <span class="material-symbols-outlined">menu</span>
    </button>
    <div class="sidebar-overlay" onclick="toggleSidebar()"></div>
    {% if messages %}
        <div id="toast-container" class="fixed top-4 right-4 z-[110] flex flex-col gap-2 transition-opacity duration-500">
            {% for message in messages %}
                <div class="px-4 py-3 rounded-lg shadow-md font-label-md {% if message.tags == 'success' %}bg-secondary-container text-secondary{% elif message.tags == 'error' %}bg-error-container text-error{% else %}bg-surface-container-highest text-on-surface{% endif %}">
                    {{ message }}
                </div>
            {% endfor %}
        </div>
        <script>
            setTimeout(function() {
                const toastContainer = document.getElementById('toast-container');
                if (toastContainer) {
                    toastContainer.style.opacity = '0';
                    setTimeout(() => toastContainer.remove(), 500);
                }
            }, 5000);
        </script>
    {% endif %}

    {% block content %}
    {% endblock %}

</body>
</html>
