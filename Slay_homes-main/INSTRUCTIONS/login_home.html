<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>

<title>Login | SmartHome Pro</title>

                        "on-tertiary-fixed-variant": "#633f00",

                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",

                        "full": "9999px"
                    },
                    "spacing": {
                        "xs": "4px",
                        "margin": "32px",
                        "sm": "12px",
                        "gutter": "24px",
                        "lg": "40px",

                        "xl": "64px"
                    },

                    "fontSize": {

<style>
        .ambient-shadow {
            box-shadow: 0px 4px 20px rgba(74, 144, 226, 0.08);
        }
        .soft-gradient {
            background: radial-gradient(circle at top left, #f8f9ff 0%, #d4e3ff 100%);
        }
        .glass-input:focus {
            box-shadow: 0 0 0 2px rgba(0, 93, 167, 0.1);
        }
    </style>
</head>
<body class="bg-background font-body-md text-on-surface min-h-screen flex items-center justify-center p-gutter soft-gradient">
<!-- Login Container -->
<main class="w-full max-w-lg">
<div class="bg-surface-container-lowest rounded-xl ambient-shadow p-lg md:p-xl flex flex-col items-center">
<!-- Branding & Illustration Header -->
<div class="text-center mb-lg">
<div class="mb-gutter inline-flex items-center justify-center w-20 h-20 rounded-full bg-primary-fixed text-primary">
<span class="material-symbols-outlined text-[40px]" data-icon="house_with_shield" style="font-variation-settings: 'FILL' 1;">house_with_shield</span>
</div>
<h1 class="font-h2 text-h2 text-on-surface mb-xs">SmartHome Pro</h1>
<p class="font-body-md text-on-surface-variant">Welcome back to your intelligent living space</p>
</div>
<!-- Login Illustration -->
<div class="w-full aspect-video rounded-xl overflow-hidden mb-lg">
<img alt="Smart Home Interface" class="w-full h-full object-cover" data-alt="A clean and bright high-key 3D illustration of a modern living room interior. The scene features soft blue and white tones with a glowing smart thermostat on a minimalist wall. Natural sunlight streams through a large window, creating soft shadows and a sense of calm. The aesthetic is contemporary, tech-focused, and inviting, reflecting the SmartHome Pro brand identity." src="https://lh3.googleusercontent.com/aida-public/AB6AXuD8o7Yc2yeUjlp2A9IOJXO_cjUtK2P2KCboK13pZprxC7QLt2Zxwqk0tO7DV-X-Egq6lypsZafNJXNkgCjfa4VSG6-6Iv8LteGsHSo-dEuU10-hREFML0WyN3UYIWEW2dW2nScr-FxveFmNcLPwGF9x1cFy4HQON4rMP6CnGLrjcHZZZrNN1iqGxXHbsAOHXp6YuGAz0Gfrk9MKWrydq7BIlQKIhAQg1zz3c6M53rY6uSbSKLKFjb29_cGReMhc45PjNAWt_F-fLQw"/>
</div>
<!-- Form Shell -->
<form class="w-full space-y-md">
<!-- Role Selector -->
<div class="flex p-1 bg-surface-container-high rounded-full w-full">
<button class="flex-1 py-2 px-4 rounded-full font-label-md bg-primary text-on-primary transition-all shadow-sm" type="button">
                        Client
                    </button>
<button class="flex-1 py-2 px-4 rounded-full font-label-md text-on-surface-variant hover:bg-surface-container transition-all" type="button">
                        Admin
                    </button>
</div>
<!-- Fields -->
<div class="space-y-sm">
<div class="space-y-xs">
<label class="font-label-md text-on-surface px-1" for="identity">Email or Username</label>
<div class="relative group">
<span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-outline group-focus-within:text-primary transition-colors" data-icon="person">person</span>
<input class="w-full pl-12 pr-4 py-3 bg-surface-container-lowest border border-outline-variant rounded-xl font-body-md placeholder:text-outline glass-input focus:border-primary focus:outline-none transition-all" id="identity" placeholder="Enter your credentials" type="text"/>
</div>
</div>
<div class="space-y-xs">
<div class="flex justify-between items-center px-1">
<label class="font-label-md text-on-surface" for="password">Password</label>
<a class="font-label-sm text-primary hover:underline" href="#">Forgot password?</a>
</div>
<div class="relative group">
<span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-outline group-focus-within:text-primary transition-colors" data-icon="lock">lock</span>
<input class="w-full pl-12 pr-12 py-3 bg-surface-container-lowest border border-outline-variant rounded-xl font-body-md placeholder:text-outline glass-input focus:border-primary focus:outline-none transition-all" id="password" placeholder="••••••••" type="password"/>
<button class="absolute right-4 top-1/2 -translate-y-1/2 text-outline hover:text-on-surface transition-colors" type="button">
<span class="material-symbols-outlined" data-icon="visibility">visibility</span>
</button>
</div>
</div>
</div>
<!-- Remember Me -->
<div class="flex items-center gap-2 px-1">
<input class="w-4 h-4 rounded border-outline-variant text-primary focus:ring-primary" id="remember" type="checkbox"/>
<label class="font-label-sm text-on-surface-variant" for="remember">Keep me logged in on this device</label>
</div>
<!-- Primary Action -->
<button class="w-full py-4 bg-primary text-on-primary font-label-md rounded-xl shadow-md hover:bg-primary-container active:scale-[0.98] transition-all flex items-center justify-center gap-2" type="submit">
                    Login
                    <span class="material-symbols-outlined" data-icon="arrow_forward">arrow_forward</span>
</button>
</form>
<!-- Secondary Actions -->
<div class="mt-lg pt-lg border-t border-outline-variant w-full text-center">
<p class="font-body-md text-on-surface-variant">
                    New to SmartHome Pro? 
                    <a class="text-secondary font-label-md hover:underline" href="#">Request Access</a>
</p>
</div>
</div>
<!-- Footer / Support Link -->
<footer class="mt-gutter text-center">
<a class="inline-flex items-center gap-1 text-on-surface-variant hover:text-primary transition-colors font-label-sm" href="#">
<span class="material-symbols-outlined text-[18px]" data-icon="support_agent">support_agent</span>
                Need help accessing your home?
            </a>
</footer>
</main>
</body></html>
